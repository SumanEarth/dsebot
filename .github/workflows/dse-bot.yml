name: DSE Watchlist Bot

on:
  schedule:
    # All times UTC. Bangladesh is UTC+6, DSE trades Sun-Thu 10:00-14:30.
    - cron: '*/15 4-8 * * 0,1,2,3,4'   # poll every 15 min, ~10:00-14:45 Dhaka
    - cron: '5 4 * * 0,1,2,3,4'         # market-open summary, 10:05 Dhaka
    - cron: '35 8 * * 0,1,2,3,4'        # market-close summary, 14:35 Dhaka
  workflow_dispatch: {}                 # lets you click "Run workflow" to test manually

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot cycle
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          FUNDAMENTAL_WEIGHT: '50'
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            python run_once.py poll --force
          else
            case "${{ github.event.schedule }}" in
              "5 4 * * 0,1,2,3,4") python run_once.py open_summary ;;
              "35 8 * * 0,1,2,3,4") python run_once.py close_summary ;;
              *) python run_once.py poll ;;
            esac
          fi

      - name: Save updated price history back to the repo
        run: |
          git config user.name "dse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dse_bot.db
          git diff --staged --quiet || git commit -m "Update price history"
          git push
